<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calibraton3000</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='13' font-size='13'%3E%E2%9A%96%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="counter" class="counter">
    <span id="session-count">0</span> this session
    <small id="remaining"></small>
  </div>

  <header class="brand">Calibraton<span>3000</span></header>

  <main id="stage">
    <article id="card" class="card" hidden>
      <div class="placement">
        <span id="rank" class="rank">—</span>
        <span id="known" class="known"></span>
      </div>

      <h1 id="title">—</h1>
      <h2 id="company">—</h2>
      <p id="blurb" class="blurb"></p>

      <p id="prompt" class="prompt">Did JobScout put this in the right place?</p>

      <div class="flags">
        <label><input type="checkbox" id="would-apply"> I would apply</label>
        <label><input type="checkbox" id="would-get"> I would get it</label>
      </div>
    </article>

    <p id="empty" class="empty" hidden>Nothing left to swipe. Export another batch from JobScout.</p>
  </main>

  <nav id="actions" class="actions">
    <button class="btn r1" data-rating="1"><b>No way</b><kbd>1</kbd></button>
    <button class="btn r2" data-rating="2"><b>Bad</b><kbd>2</kbd></button>
    <button class="btn r3" data-rating="3"><b>Meh</b><kbd>3</kbd></button>
    <button class="btn r4" data-rating="4"><b>Ok</b><kbd>4</kbd></button>
    <button class="btn r5" data-rating="5"><b>Great</b><kbd>5</kbd></button>
  </nav>

  <footer class="footer">
    <button id="btn-end" class="link">End session &amp; recalibrate</button>
    <button id="btn-trends" class="link">Drift</button>
  </footer>

  <div id="toast" class="toast" hidden></div>

  <dialog id="trends-dialog">
    <h3>Correction drift</h3>
    <pre id="trends-body">—</pre>
    <button id="btn-close-trends" class="link">Close</button>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
